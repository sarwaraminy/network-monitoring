# Local-dev-only override: exposes the database on the host so `npm run dev`
# (which runs the API on the host, not in a container) can reach it directly.
#
# Applied automatically by `npm run dev` via scripts/ensure-db.mjs when no
# other Postgres is already reachable at api/.env's DATABASE_URL — see that
# script for exactly when this kicks in. To run it by hand instead:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d db
#
# Binds the same host port (5432) a native Postgres install would use.
# ensure-db.mjs can't tell "nothing installed" from "installed but not
# running right now" — both look like connection-refused — so if you have a
# native Postgres that's just stopped, start that instead of leaving this
# running, or the two will fight over the port.

services:
  db:
    ports:
      # Bound to loopback only — a bare '5432:5432' publishes on 0.0.0.0 (every
      # interface), which would expose this dev database to the whole network
      # a developer's machine is on, not just itself.
      - '127.0.0.1:5432:5432'
