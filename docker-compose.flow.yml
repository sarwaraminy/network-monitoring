# Publishes the flow collector's UDP port.
#
# Separate from docker-compose.yml on purpose. `ports:` publishes at container
# start — Docker binds the host port and installs the forwarding rule whether or
# not anything inside the container is listening. So putting this in the main
# file bound 0.0.0.0:2055/udp on every deployment, including the default one
# where FLOW_ENABLED is false: it showed in `ss -lun` and answered a scanner as
# an open UDP port. That is precisely what FLOW_ENABLED exists to prevent —
# "a listening port nobody asked for is not something a deployment should
# acquire" — and it also broke `up` outright on a host already running a NetFlow
# collector on 2055, with `port is already allocated`.
#
# Compose has no conditional `ports:`, so the opt-in is the overlay itself:
#
#   docker compose -f docker-compose.yml -f docker-compose.flow.yml up -d
#
# Set FLOW_ENABLED=true alongside it, or the port is published to a process that
# is not listening.

services:
  api:
    ports:
      - '${FLOW_PORT:-2055}:${FLOW_PORT:-2055}/udp'
