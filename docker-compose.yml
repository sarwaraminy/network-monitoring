# Network Monitoring Tool — full stack.
#
#   cp .env.docker.example .env
#   docker compose up --build
#
# Then open http://localhost:8080 (nginx serves the UI and proxies the API).
#
# LIVE PACKET CAPTURE DOES NOT WORK IN THIS CONFIGURATION, by design: the API
# container has its own network namespace, so it would only ever see its own
# traffic. Everything else — alerts, history, lookups, auth — works normally.
# To capture, either run the API on the host (`npm run dev:api`), or on a Linux
# host add the override:
#
#   docker compose -f docker-compose.yml -f docker-compose.capture.yml up --build
#
# See the README for why this is Linux-only.
#
# FLOW COLLECTION, HOWEVER, WORKS FINE IN A CONTAINER and on every platform: the
# switch or firewall does the observing and sends summaries over UDP, so there is
# nothing to capture locally and no privileges to grant. That makes it the
# practical way to get real network-wide detection out of a containerised deploy:
#
#   docker compose -f docker-compose.yml -f docker-compose.flow.yml up --build

name: network-monitoring

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netminitoring}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Without this the API would start migrating before Postgres accepts connections.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-netminitoring}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-netminitoring}
      DB_AUTO_MIGRATE: 'true'
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      # nginx proxies same-origin, so no cross-origin browser requests are made.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      REDACT_PACKET_PAYLOAD: ${REDACT_PACKET_PAYLOAD:-true}
      # nginx is unconditionally in front of the api here — it is `expose`-only,
      # so every request arrives through the ui service, which sets
      # X-Forwarded-For. Without this the rate limiter keys every client to the
      # nginx container address and they all share one bucket: 20 bad logins
      # from anyone locks everybody out. A direct host install must leave it off.
      TRUST_PROXY: ${TRUST_PROXY:-true}
      CAPTURE_BUFFER_SIZE: ${CAPTURE_BUFFER_SIZE:-5000}
      ARP_TRUSTED_MAPPINGS: ${ARP_TRUSTED_MAPPINGS:-}
      # Public registration. Off by default; a self-registered account is always
      # a USER regardless. Listed explicitly because the api service does not
      # inherit the host environment — without this line the README-documented
      # setting silently has no effect under Compose.
      ALLOW_OPEN_SIGNUP: ${ALLOW_OPEN_SIGNUP:-false}
      # Threat intelligence. Off unless INTEL_ENABLED is set; no feeds ship by
      # default, so nothing is fetched until you choose a source.
      INTEL_ENABLED: ${INTEL_ENABLED:-false}
      INTEL_FEEDS: ${INTEL_FEEDS:-}
      INTEL_REFRESH_HOURS: ${INTEL_REFRESH_HOURS:-6}
      INTEL_MAX_INDICATORS: ${INTEL_MAX_INDICATORS:-500000}
      # Cached feed copies. Documented in api/.env.example but previously missing
      # here — the same omission as ALLOW_OPEN_SIGNUP last round. Backed by a
      # named volume below, or the README's promise that "a restart without
      # connectivity starts from the last known-good copy" is false under
      # Compose: every --force-recreate would start from nothing.
      INTEL_CACHE_DIR: /var/lib/nmt/intel
      # Alert delivery. Off unless NOTIFY_ENABLED is set in .env; see the README
      # for the severity gate, throttle and hourly ceiling that bound the volume.
      NOTIFY_ENABLED: ${NOTIFY_ENABLED:-false}
      NOTIFY_MIN_SEVERITY: ${NOTIFY_MIN_SEVERITY:-high}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      NOTIFY_WEBHOOK_FORMAT: ${NOTIFY_WEBHOOK_FORMAT:-auto}
      NOTIFY_DASHBOARD_URL: ${NOTIFY_DASHBOARD_URL:-http://localhost:${HTTP_PORT:-8080}/alerts}
      NOTIFY_INCLUDE_EVIDENCE: ${NOTIFY_INCLUDE_EVIDENCE:-true}
      NOTIFY_DIGEST_SECONDS: ${NOTIFY_DIGEST_SECONDS:-60}
      NOTIFY_THROTTLE_SECONDS: ${NOTIFY_THROTTLE_SECONDS:-900}
      NOTIFY_MAX_PER_HOUR: ${NOTIFY_MAX_PER_HOUR:-12}
      NOTIFY_EMAIL_TO: ${NOTIFY_EMAIL_TO:-}

      # Syslog / CEF export to a SIEM. Set SYSLOG_HOST to switch it on.
      #
      # Deliberately not governed by NOTIFY_ENABLED or the gates above: a SIEM
      # correlates and deduplicates itself and needs the complete stream. See
      # api/src/notify/syslog.ts.
      SYSLOG_HOST: ${SYSLOG_HOST:-}
      SYSLOG_PORT: ${SYSLOG_PORT:-514}
      SYSLOG_PROTOCOL: ${SYSLOG_PROTOCOL:-udp}
      SYSLOG_FORMAT: ${SYSLOG_FORMAT:-cef}
      SYSLOG_RFC: ${SYSLOG_RFC:-5424}
      SYSLOG_FACILITY: ${SYSLOG_FACILITY:-16}
      SYSLOG_APP_NAME: ${SYSLOG_APP_NAME:-nmt}
      SYSLOG_INCLUDE_EVIDENCE: ${SYSLOG_INCLUDE_EVIDENCE:-true}

      # Flow collection. The driver-free path: point a switch or router at
      # FLOW_PORT and no capture library is needed at all.
      #
      # Publishing the port is a SEPARATE opt-in, in docker-compose.flow.yml.
      # `ports:` binds the host port whether or not anything is listening, so
      # putting it here opened 2055/udp on every deployment — including the
      # default one where this is false, which is the thing this setting exists
      # to prevent.
      #
      #   docker compose -f docker-compose.yml -f docker-compose.flow.yml up -d
      FLOW_ENABLED: ${FLOW_ENABLED:-false}
      FLOW_PORT: ${FLOW_PORT:-2055}
      FLOW_BIND_ADDRESS: ${FLOW_BIND_ADDRESS:-0.0.0.0}
      # Empty accepts any exporter. Narrow it: the collector is an unauthenticated
      # write path into the alert table, and a forged flow forges a finding.
      FLOW_EXPORTERS: ${FLOW_EXPORTERS:-}

      # Capture tuning.
      CAPTURE_POLL_INTERVAL_MS: ${CAPTURE_POLL_INTERVAL_MS:-10}

      # Rate limits. Operator-tunable because the right value depends on how many
      # people share an egress address.
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-20}
      RATE_LIMIT_CAPTURE_PER_MINUTE: ${RATE_LIMIT_CAPTURE_PER_MINUTE:-20}
      RATE_LIMIT_LOOKUP_PER_MINUTE: ${RATE_LIMIT_LOOKUP_PER_MINUTE:-30}
      RATE_LIMIT_API_PER_MINUTE: ${RATE_LIMIT_API_PER_MINUTE:-600}

      # Detector thresholds. These are the tuning knobs — an authorised scanner
      # on the network is the usual reason to raise one.
      DETECT_SCAN_WINDOW_MS: ${DETECT_SCAN_WINDOW_MS:-60000}
      DETECT_PORT_SCAN_PORTS: ${DETECT_PORT_SCAN_PORTS:-15}
      DETECT_HOST_SWEEP_HOSTS: ${DETECT_HOST_SWEEP_HOSTS:-20}
      DETECT_FLOOD_WINDOW_MS: ${DETECT_FLOOD_WINDOW_MS:-10000}
      DETECT_SYN_FLOOD_ATTEMPTS: ${DETECT_SYN_FLOOD_ATTEMPTS:-300}
      DETECT_DNS_SUBDOMAINS: ${DETECT_DNS_SUBDOMAINS:-40}
      DETECT_DEVICE_LEARNING_MS: ${DETECT_DEVICE_LEARNING_MS:-60000}
      DETECT_ALERT_WINDOW_MS: ${DETECT_ALERT_WINDOW_MS:-300000}

      # Retention. Alerts expire in detail after ALERT_RETENTION_DAYS and survive as
      # daily rollups, which are never pruned — so a long dashboard window keeps its
      # shape after the rows have gone. RETENTION_ENABLED=false keeps everything.
      # Under seven days is clamped up, loudly: a slipped digit deletes findings
      # irreversibly.
      RETENTION_ENABLED: ${RETENTION_ENABLED:-true}
      ALERT_RETENTION_DAYS: ${ALERT_RETENTION_DAYS:-365}
      DEVICE_RETENTION_DAYS: ${DEVICE_RETENTION_DAYS:-365}
      RETENTION_SWEEP_HOURS: ${RETENTION_SWEEP_HOURS:-24}
      # Ad Hoc Query console — a read-only SQL page for administrators. OFF by
      # default, because switched on without thought it is a SQL prompt on the
      # production database reachable from a browser session. Its Postgres role
      # is fixed in code (nm_adhoc, SELECT-only, secrets excluded at the column
      # level) and only the password is configurable: a settable connection
      # string would be one that could be pointed at the superuser, turning every
      # restriction off while the feature still appeared to work.
      ADHOC_ENABLED: ${ADHOC_ENABLED:-false}
      ADHOC_DB_PASSWORD: ${ADHOC_DB_PASSWORD:-}
      ADHOC_TIMEOUT_MS: ${ADHOC_TIMEOUT_MS:-10000}
      ADHOC_MAX_ROWS: ${ADHOC_MAX_ROWS:-1000}
      # Lets the console write as well as read. Selects a different Postgres
      # role rather than just permitting writes in the app — see
      # V12__Adhoc_write_role.sql and .env.docker.example.
      ADHOC_WRITE_ENABLED: ${ADHOC_WRITE_ENABLED:-false}
      ADHOC_MAX_QUERY_LENGTH: ${ADHOC_MAX_QUERY_LENGTH:-20000}
      # all | refused | off — see .env.docker.example.
      ADHOC_AUDIT: ${ADHOC_AUDIT:-all}
      NOTIFY_EMAIL_FROM: ${NOTIFY_EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    expose:
      - '8080'
    volumes:
      - intel-cache:/var/lib/nmt/intel

  ui:
    build:
      context: .
      dockerfile: network-monitoring-ui/Dockerfile
      args:
        # Empty: requests go to nginx on the same origin.
        VITE_API_SERVER: ''
        VITE_POLL_INTERVAL_MS: ${VITE_POLL_INTERVAL_MS:-1000}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${HTTP_PORT:-8080}:80'

volumes:
  db-data:
  intel-cache:
