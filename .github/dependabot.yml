version: 2

# Tuned for a small team, where review time is the scarce resource.
#
# The first version of this file limited npm to 5 open PRs but left the limit
# unset on the other three ecosystems, where it defaults to 5 each — an effective
# ceiling of 20. Only npm had grouping, so GitHub Actions and Docker opened one PR
# per dependency. The result was thirteen open PRs nobody was going to read, which
# is worse than none: a real security update gets lost in that noise.
#
# Everything below is grouped hard and capped low, so a routine month produces a
# handful of PRs rather than a backlog.
#
# Schedule, grouping and open-pull-requests-limit do not hold back a security
# update — Dependabot raises those separately from version updates, so a quiet
# cadence here does not delay a patch for a known vulnerability.
#
# `ignore` is different, and the distinction matters. An ignore rule suppresses
# the security update too, so a package with an open advisory must never appear in
# the list below. Check `npm audit` before adding one.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Two grouped PRs, one standalone drizzle-orm PR (see exclude-patterns below),
    # plus room for one ungrouped major. Raised from 3 when drizzle-orm was pulled
    # out of its group: leaving it at 3 would let the drizzle PR crowd out a real
    # major, which is the same failure this file keeps having — arithmetic in a
    # comment that no longer matches the config under it.
    open-pull-requests-limit: 4
    groups:
      # Everything that cannot reach production in a bad state: tooling, types,
      # test libraries. Reviewable by whether CI is green.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      # Runtime patches and minors together. Majors stay individual, because those
      # are the ones that actually need reading.
      production-updates:
        dependency-type: production
        update-types: [minor, patch]
        # drizzle-orm lands on its own, and the reason is a 0.x semver quirk that
        # defeated the "majors stay individual" reasoning above without this file
        # ever being wrong on its face.
        #
        # Dependabot reads 0.36 -> 0.45 as a MINOR bump, because the minor field
        # is what changed, so it matched this group. `npm audit` disagrees and
        # reports isSemVerMajor: true, which is the more honest reading — 0.x
        # minors break APIs routinely and this one does. The upgrade that most
        # needs reading (an ORM major, on the database layer, closing an open
        # high-severity advisory) therefore arrived as the least visible line in a
        # nine-package batch.
        #
        # It is the only 0.x production dependency in the tree today. Any other
        # added later needs the same treatment, for the same reason.
        exclude-patterns: ['drizzle-orm']
    ignore:
      # Major upgrades of these change APIs across many files. Do them
      # deliberately — MUI 9 in particular is incompatible with the pinned
      # Material React Table, which took a long time to diagnose.
      - dependency-name: express
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: '@mui/material'
        update-types: [version-update:semver-major]
      - dependency-name: '@mui/icons-material'
        update-types: [version-update:semver-major]
      - dependency-name: material-react-table
        update-types: [version-update:semver-major]
      - dependency-name: react-router-dom
        update-types: [version-update:semver-major]
      # drizzle-orm is deliberately NOT ignored, despite a major upgrade being
      # disruptive. It carries an open high-severity advisory (SQL injection via
      # improperly escaped identifiers, GHSA) whose only fix is a semver major, and
      # an ignore rule here would suppress that security PR as well.
      #
      # Reviewed against this codebase and not exploitable as written: there is no
      # sql.identifier() call anywhere, every pgTable() name is a string literal,
      # and the single sql.raw() inlines a ternary over two hardcoded strings. No
      # user input can reach an identifier position. Upgrade deliberately rather
      # than urgently — but keep seeing the PR.

  # Action versions move rarely and matter little. One PR, grouped.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ['*']

  # Base images for both Dockerfiles, one PR each. Node, Postgres and nginx
  # majors are excluded: those are a decision about what the product supports,
  # not an upgrade to merge on a green build.
  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      api-base-images:
        patterns: ['*']
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /network-monitoring-ui
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      ui-base-images:
        patterns: ['*']
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: nginx
        update-types: [version-update:semver-major]
