# nginx resolves an `upstream` server name once, at startup, and refuses to start
# at all if it does not resolve — so a slow, restarting or absent API container
# takes the whole web tier down with it. Using a variable in proxy_pass instead
# defers resolution to request time: nginx always starts and serves the bundle,
# and only the proxied requests fail (502) while the API is unavailable.
#
# 127.0.0.11 is Docker's embedded DNS, which is what resolves the compose service
# name. Override API_UPSTREAM at container start to point somewhere else.

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    # Held in a variable so nginx does not resolve it during startup.
    set $api_upstream "api:8080";

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames make long caching safe; index.html must not be cached
    # or a deploy would keep serving the old bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # The API, proxied so the browser stays same-origin.
    #
    # `/user-guide` is on this list and not served from the bundle on purpose: the
    # guide is gated by a session cookie the API checks, and a copy under the web
    # root would be handed out by this server without any check at all. It must
    # reach the API, and it must be matched before the SPA fallback below.
    location ~ ^/(api|auth|health|ready|user-guide)(/|$) {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Capture responses can be large; give them room.
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Single-page app: unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The app's own CSP is not set here because index.html is served as-is; these
    # are the headers that do not depend on page content.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
